<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem('nexabank-theme');document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transfer — NexaBank</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div id="topbar-mount"></div>

    <div class="page">
      <div class="page-head">
        <div>
          <h1>Transfer money</h1>
          <div class="sub">Transfers are reviewed by an admin before funds move.</div>
        </div>
      </div>

      <div class="form-grid">
        <div class="card">
          <form id="transfer-form" novalidate>
            <div class="field">
              <label for="recipient">Recipient account number</label>
              <input type="text" id="recipient" name="recipient" inputmode="numeric" maxlength="10" placeholder="10-digit account number" required />
            </div>
            <div class="field">
              <label for="amount">Amount</label>
              <div class="input-prefix"><span>$</span><input type="number" min="1" step="0.01" id="amount" name="amount" placeholder="0.00" required /></div>
            </div>
            <div class="field">
              <label for="description">Description</label>
              <input type="text" id="description" name="description" placeholder="What's this for?" />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Review &amp; submit</button>
          </form>
        </div>

        <div class="card">
          <div class="eyebrow">Summary</div>
          <div class="summary-box mt-16">
            <div class="summary-row"><span class="k">Available balance</span><span class="v mono" id="available-balance">$0.00</span></div>
            <div class="summary-row"><span class="k">Approval</span><span class="v">Required</span></div>
            <div class="summary-row"><span class="k">Typical review time</span><span class="v">Same business day</span></div>
          </div>
        </div>
      </div>

      <div class="section-title">
        <h3>Transfer history</h3>
      </div>
      <div class="card" id="transfer-history"></div>
    </div>
  </div>
</div>

<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/transfer.js"></script>
</body>
</html>
